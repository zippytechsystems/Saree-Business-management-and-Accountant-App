<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1329"/>
      <stop offset="100%" stop-color="#0b1b4a"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d5cf0"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#webBg)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Laptop / Browser Window -->
  <rect x="80" y="60" width="640" height="380" rx="16" fill="#0d1830" stroke="#1d5cf0" stroke-width="2"/>
  <!-- Browser Header -->
  <rect x="80" y="60" width="640" height="40" rx="16" fill="#091224"/>
  <circle cx="105" cy="80" r="5" fill="#ef4444"/>
  <circle cx="120" cy="80" r="5" fill="#f59e0b"/>
  <circle cx="135" cy="80" r="5" fill="#10b981"/>
  <rect x="170" y="70" width="300" height="20" rx="6" fill="#132344"/>
  <text x="210" y="84" fill="#93c5fd" font-family="sans-serif" font-size="11">https://citycareclinic.in/appointment</text>

  <!-- Web Content Area -->
  <rect x="110" y="125" width="280" height="280" rx="12" fill="#122040"/>
  <!-- Clinic Hero -->
  <text x="130" y="160" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="bold">HEALTHCARE &amp; WELLNESS</text>
  <text x="130" y="195" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold">24/7 Doctor Booking</text>
  <text x="130" y="225" fill="#94a3b8" font-family="sans-serif" font-size="12">Instant appointment confirmation via WhatsApp.</text>

  <!-- Doctor Selection -->
  <rect x="130" y="250" width="240" height="48" rx="8" fill="#182c55"/>
  <circle cx="155" cy="274" r="14" fill="#1d5cf0"/>
  <text x="180" y="268" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Dr. Sharma, MD</text>
  <text x="180" y="284" fill="#94a3b8" font-family="sans-serif" font-size="10">Cardiology • 15+ Yrs Exp</text>

  <rect x="130" y="310" width="240" height="38" rx="8" fill="url(#blueGlow)"/>
  <text x="185" y="334" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Confirm Slot (₹500)</text>

  <!-- Right Web Features Panel -->
  <rect x="420" y="125" width="270" height="280" rx="12" fill="#101c38" stroke="rgba(29, 92, 240, 0.3)" stroke-width="1"/>
  <text x="440" y="160" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="bold">ONLINE PORTAL HIGHLIGHTS</text>
  <text x="440" y="195" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Automated Booking Pipeline</text>
  
  <circle cx="450" cy="230" r="4" fill="#1d5cf0"/>
  <text x="465" y="234" fill="#cbd5e1" font-family="sans-serif" font-size="12">Google My Business &amp; Map Sync</text>

  <circle cx="450" cy="265" r="4" fill="#1d5cf0"/>
  <text x="465" y="269" fill="#cbd5e1" font-family="sans-serif" font-size="12">WhatsApp Reminder Bot</text>

  <circle cx="450" cy="300" r="4" fill="#1d5cf0"/>
  <text x="465" y="304" fill="#cbd5e1" font-family="sans-serif" font-size="12">Digital Patient Health Records</text>

  <circle cx="450" cy="335" r="4" fill="#1d5cf0"/>
  <text x="465" y="339" fill="#cbd5e1" font-family="sans-serif" font-size="12">UPI &amp; Card Payment Gateway</text>
</svg>
