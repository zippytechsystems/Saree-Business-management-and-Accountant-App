<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="appBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1910"/>
      <stop offset="100%" stop-color="#0b1b4a"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12a150"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#appBg)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Phone Frame Center Left -->
  <rect x="120" y="50" width="220" height="400" rx="32" fill="#0d1b1e" stroke="#12a150" stroke-width="3"/>
  <rect x="180" y="60" width="100" height="18" rx="9" fill="#060e10"/>
  
  <!-- App Screen UI -->
  <rect x="135" y="90" width="190" height="340" rx="16" fill="#132320"/>
  <!-- App Header -->
  <rect x="145" y="105" width="170" height="35" rx="8" fill="#1a332a"/>
  <text x="155" y="128" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold">Saree Khata &amp; POS</text>
  <circle cx="300" cy="122" r="5" fill="#12a150"/>
  
  <!-- Metrics Card -->
  <rect x="145" y="150" width="170" height="60" rx="10" fill="#0d1f18" stroke="#12a150" stroke-width="1"/>
  <text x="155" y="172" fill="#9ca3af" font-family="sans-serif" font-size="10">Today's Sales</text>
  <text x="155" y="196" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">₹48,500</text>
  <text x="260" y="196" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">+18%</text>

  <!-- Inventory Items -->
  <rect x="145" y="220" width="170" height="38" rx="8" fill="#172b22"/>
  <text x="155" y="244" fill="#ffffff" font-family="sans-serif" font-size="11">Banarasi Silk (#802)</text>
  <text x="270" y="244" fill="#34d399" font-family="sans-serif" font-size="11">Qty: 24</text>

  <rect x="145" y="266" width="170" height="38" rx="8" fill="#172b22"/>
  <text x="155" y="290" fill="#ffffff" font-family="sans-serif" font-size="11">Kanchipuram (#410)</text>
  <text x="270" y="290" fill="#34d399" font-family="sans-serif" font-size="11">Qty: 18</text>

  <!-- Quick Action -->
  <rect x="145" y="315" width="170" height="36" rx="8" fill="url(#greenGlow)"/>
  <text x="175" y="338" fill="#0b1b4a" font-family="sans-serif" font-size="12" font-weight="bold">+ New GST Invoice</text>

  <!-- Right Side Dashboard Card -->
  <rect x="380" y="90" width="340" height="300" rx="20" fill="#0b172a" stroke="rgba(18, 161, 80, 0.4)" stroke-width="2"/>
  <text x="410" y="130" fill="#12a150" font-family="sans-serif" font-size="13" font-weight="bold">MOBILE &amp; CLOUD SYNC</text>
  <text x="410" y="165" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">Textile Inventory &amp; POS</text>
  <text x="410" y="195" fill="#94a3b8" font-family="sans-serif" font-size="13">Offline-first mobile accounting tailored for wholesale</text>
  <text x="410" y="215" fill="#94a3b8" font-family="sans-serif" font-size="13">&amp; retail shops with barcode scanner and WhatsApp PDF bills.</text>

  <!-- Feature Tags -->
  <rect x="410" y="250" width="120" height="28" rx="14" fill="rgba(18, 161, 80, 0.15)" stroke="#12a150" stroke-width="1"/>
  <text x="425" y="268" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">Barcode Scanner</text>

  <rect x="540" y="250" width="130" height="28" rx="14" fill="rgba(18, 161, 80, 0.15)" stroke="#12a150" stroke-width="1"/>
  <text x="555" y="268" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">GST Invoice PDF</text>

  <rect x="410" y="290" width="140" height="28" rx="14" fill="rgba(18, 161, 80, 0.15)" stroke="#12a150" stroke-width="1"/>
  <text x="425" y="308" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">Udhar / Khata Ledger</text>

  <rect x="560" y="290" width="130" height="28" rx="14" fill="rgba(18, 161, 80, 0.15)" stroke="#12a150" stroke-width="1"/>
  <text x="575" y="308" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">Thermal Print Sync</text>
</svg>
