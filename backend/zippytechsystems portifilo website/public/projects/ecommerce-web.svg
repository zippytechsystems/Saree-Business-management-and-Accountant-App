<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1738"/>
      <stop offset="100%" stop-color="#071024"/>
    </linearGradient>
    <linearGradient id="ecomBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d5cf0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ecomBg)"/>

  <!-- Browser Container -->
  <rect x="70" y="50" width="660" height="400" rx="16" fill="#0d1b38" stroke="#1d5cf0" stroke-width="2"/>
  <rect x="70" y="50" width="660" height="40" rx="16" fill="#091224"/>
  <circle cx="95" cy="70" r="5" fill="#ef4444"/>
  <circle cx="110" cy="70" r="5" fill="#f59e0b"/>
  <circle cx="125" cy="70" r="5" fill="#10b981"/>
  <rect x="155" y="60" width="280" height="20" rx="6" fill="#14264d"/>
  <text x="180" y="74" fill="#93c5fd" font-family="sans-serif" font-size="11">https://zaraafashion.in/checkout</text>

  <!-- Store Header -->
  <rect x="100" y="110" width="600" height="45" rx="8" fill="#12254e"/>
  <text x="120" y="138" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">ZARAA BOUTIQUE</text>
  <text x="540" y="138" fill="#ffe500" font-family="sans-serif" font-size="13" font-weight="bold">🛒 Cart (2) • ₹2,499</text>

  <!-- Product 1 Card -->
  <rect x="100" y="175" width="180" height="240" rx="12" fill="#162c5c"/>
  <rect x="110" y="185" width="160" height="120" rx="8" fill="#1f3b7a"/>
  <text x="155" y="250" fill="#93c5fd" font-family="sans-serif" font-size="28">👗</text>
  <text x="115" y="325" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Embroidered Anarkali</text>
  <text x="115" y="345" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">₹1,799 <tspan fill="#64748b" font-size="11" text-decoration="line-through">₹3,499</tspan></text>
  <rect x="110" y="365" width="160" height="32" rx="6" fill="#1d5cf0"/>
  <text x="145" y="385" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Add to Cart</text>

  <!-- Product 2 Card -->
  <rect x="300" y="175" width="180" height="240" rx="12" fill="#162c5c"/>
  <rect x="310" y="185" width="160" height="120" rx="8" fill="#1f3b7a"/>
  <text x="355" y="250" fill="#93c5fd" font-family="sans-serif" font-size="28">✨</text>
  <text x="315" y="325" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Pure Silk Dupatta</text>
  <text x="315" y="345" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">₹699 <tspan fill="#64748b" font-size="11" text-decoration="line-through">₹1,299</tspan></text>
  <rect x="310" y="365" width="160" height="32" rx="6" fill="#1d5cf0"/>
  <text x="345" y="385" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Add to Cart</text>

  <!-- Checkout Drawer / UPI Preview -->
  <rect x="500" y="175" width="200" height="240" rx="12" fill="#0f2042" stroke="#38bdf8" stroke-width="1"/>
  <text x="515" y="205" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Instant UPI Checkout</text>
  <text x="515" y="230" fill="#94a3b8" font-family="sans-serif" font-size="11">Total: ₹2,499</text>
  <rect x="515" y="250" width="170" height="36" rx="8" fill="#182c55"/>
  <text x="530" y="273" fill="#cbd5e1" font-family="sans-serif" font-size="11">GPay • PhonePe • Paytm</text>
  <rect x="515" y="300" width="170" height="38" rx="8" fill="#12a150"/>
  <text x="545" y="324" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Pay via UPI</text>
  <text x="525" y="365" fill="#ffe500" font-family="sans-serif" font-size="10">⚡ Order sync to WhatsApp</text>
</svg>
