<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="invBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e33"/>
      <stop offset="100%" stop-color="#0b1b4a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#invBg)"/>

  <!-- Workflow Pipeline Flow -->
  <!-- Step 1: Order Closed -->
  <rect x="70" y="160" width="180" height="180" rx="16" fill="#140a2b" stroke="#7a2fd0" stroke-width="2"/>
  <circle cx="160" cy="205" r="22" fill="rgba(122, 47, 208, 0.3)"/>
  <text x="150" y="213" fill="#c084fc" font-family="sans-serif" font-size="20">📝</text>
  <text x="95" y="250" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Deal / Order Logged</text>
  <text x="85" y="275" fill="#94a3b8" font-family="sans-serif" font-size="11">Google Sheet / CRM or</text>
  <text x="85" y="290" fill="#94a3b8" font-family="sans-serif" font-size="11">Web Form confirmation</text>

  <!-- Arrow 1 -->
  <path d="M260 250 L300 250" stroke="#7a2fd0" stroke-width="3" stroke-dasharray="4 4"/>
  <polygon points="300,245 310,250 300,255" fill="#7a2fd0"/>

  <!-- Step 2: AI Invoice Gen -->
  <rect x="315" y="140" width="200" height="220" rx="16" fill="#1c0f3d" stroke="#c084fc" stroke-width="2"/>
  <rect x="330" y="155" width="170" height="30" rx="6" fill="#7a2fd0"/>
  <text x="355" y="175" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">AI PDF Generator</text>
  <circle cx="415" cy="225" r="24" fill="rgba(192, 132, 252, 0.2)"/>
  <text x="405" y="233" fill="#ffe500" font-family="sans-serif" font-size="22">⚡</text>
  <text x="345" y="275" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">GST-Ready Invoice</text>
  <text x="340" y="295" fill="#cbd5e1" font-family="sans-serif" font-size="11">Auto-calculates tax, adds</text>
  <text x="340" y="310" fill="#cbd5e1" font-family="sans-serif" font-size="11">UPI QR &amp; bank details</text>
  <text x="350" y="340" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">⏱️ Completed in 0.8s</text>

  <!-- Arrow 2 -->
  <path d="M525 250 L565 250" stroke="#7a2fd0" stroke-width="3" stroke-dasharray="4 4"/>
  <polygon points="565,245 575,250 565,255" fill="#7a2fd0"/>

  <!-- Step 3: WhatsApp Dispatch & Reminder -->
  <rect x="580" y="160" width="180" height="180" rx="16" fill="#140a2b" stroke="#12a150" stroke-width="2"/>
  <circle cx="670" cy="205" r="22" fill="rgba(18, 161, 80, 0.2)"/>
  <text x="660" y="213" fill="#34d399" font-family="sans-serif" font-size="20">📲</text>
  <text x="600" y="250" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">WhatsApp Dispatch</text>
  <text x="595" y="275" fill="#94a3b8" font-family="sans-serif" font-size="11">Instant PDF delivered</text>
  <text x="595" y="290" fill="#94a3b8" font-family="sans-serif" font-size="11">+ Friendly reminders</text>
  <text x="595" y="305" fill="#94a3b8" font-family="sans-serif" font-size="11">before due date</text>

  <!-- Header Banner -->
  <text x="250" y="80" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="bold">AUTOMATED BILLING &amp; REMINDERS</text>
  <text x="230" y="110" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold">Zero-Touch Invoicing Pipeline</text>
</svg>
